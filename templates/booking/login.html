{% extends 'base.html' %}

{% block title %}Đăng nhập - StayEase{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
                <div class="text-center mb-4">
                    <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-inline-flex p-3 mb-2">
                        <i class="fa-solid fa-arrow-right-to-bracket fs-3"></i>
                    </div>
                    <h3 class="fw-bold">Đăng Nhập Tài Khoản</h3>
                    <p class="text-muted small">Chào mừng bạn quay lại hệ thống StayEase</p>
                </div>

                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Tên đăng nhập</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fa-solid fa-user text-muted"></i></span>
                            <input type="text" name="username" class="form-control" required autofocus placeholder="Tên đăng nhập">
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-semibold">Mật khẩu</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fa-solid fa-lock text-muted"></i></span>
                            <input type="password" name="password" class="form-control" required placeholder="••••••••">
                        </div>
                    </div>
                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary btn-lg rounded-3 fw-bold">
                            Đăng Nhập
                        </button>
                    </div>
                </form>

                <div class="text-center small text-muted">
                    Chưa có tài khoản? <a href="{% url 'booking:register' %}" class="text-decoration-none fw-semibold">Đăng ký ngay</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
